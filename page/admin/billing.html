<main data-flux="update-link" id="main-content" class="stack">
	<admin-header />
	<header class="stack compact">
		<h1>Billing</h1>
		<p data-bind:text="scopeLabel">No applications</p>
	</header>
	<p class="notice" role="note">This screen is not connected yet. Its controls are unavailable.</p>
	<section class="settings-panel stack">
		<h2>Current plan</h2>
		<p class="metric">—</p>
		<p>—</p>
		<p>—</p>
	</section>
	<section class="settings-panel stack">
		<h2>Usage</h2>
		<p>Monthly authenticated users</p>
		<strong>—</strong>
		<p>Your billing period resets on the first day of next month.</p>
	</section>
	<section class="settings-panel stack">
		<h2>Change plan</h2>
		<form method="post" class="form-fields stack compact">

			<label><span>Plan</span><select name="plan" disabled><option>Not available yet</option></select></label>
			<p>This only changes your plan. No charge is made.</p>
			<div class="actions">
				<button type="submit" class="primary" disabled>Change plan</button>
			</div>
		</form>
	</section>
</main>
