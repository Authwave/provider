<main data-flux="update-link" id="main-content" class="stack">
	<admin-header />

	<header class="application-heading" data-flux="update">
		<nav class="breadcrumbs" aria-label="Breadcrumb">
			<h1><a href="/admin/applications/" aria-current="page">Applications</a></h1>
		</nav>
	</header>

	<section id="first-application" class="settings-panel stack onboarding-note" hidden data-bind:hidden="?!needsApplication">

	<div class="applications-layout">
		<application-list />
		<application-create />
	</div>
</main>
