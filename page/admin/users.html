<main data-flux="update-link" id="main-content" class="stack">
	<admin-header />
	<header class="stack compact">
		<h1>Users</h1>
		<p data-bind:text="scopeLabel">No applications</p>
	</header>
	<p class="notice" role="note">This screen is not connected yet. Its controls are unavailable.</p>
	<div class="card-grid">
		<section class="settings-panel stack">
			<h2>Currently logged in</h2>
			<p class="metric">—</p>
			<ul class="record-list">

			</ul>
		</section>
		<section class="settings-panel stack">
			<h2>Latest login failures</h2>
			<ul class="record-list">

			</ul>
		</section>
	</div>
	<section class="settings-panel stack">
		<h2>All users</h2>
		<form method="get" class="filter-grid">
			<label><span>Search users</span><input type="search" name="search" placeholder="Email address" disabled /></label>
			<label><span>Status</span><select name="userStatus" disabled><option value="all">All users</option><option value="online">Online now</option><option value="failed">Recent login failure</option><option value="abandoned">Abandoned</option></select></label>
			<label><span>Sort by</span><select name="userSort" disabled><option value="logins">Sign-in count</option><option value="created">Created date</option><option value="email">Email address</option></select></label>
			<label class="checkbox-field"><input type="checkbox" name="reveal" value="yes" disabled /><span>Show email addresses</span></label>
			<div class="actions">
				<button type="submit" disabled>Apply filters</button>
			</div>
		</form>
		<div class="table-scroll">
			<table class="record-table">
				<thead>
					<tr>
						<th scope="col">Email</th>
						<th scope="col">Application</th>
						<th scope="col">Log-ins</th>
						<th scope="col">Created</th>
						<th scope="col">Last seen</th>
						<th scope="col">Country</th>
						<th scope="col">Device</th>
					</tr>
				</thead>
				<tbody>

				</tbody>
			</table>
		</div>
		<p>No users match these filters.</p>
		<p>—</p>
		<nav class="actions" aria-label="User pages"><a class="control" aria-disabled="true">Previous</a><a class="control" aria-disabled="true">Next</a></nav>
	</section>
	<section class="settings-panel stack" id="add-user">
		<h2>Add a user</h2>
		<form method="post" class="form-fields stack compact">

			<label><span>Email address</span><input type="email" name="email" required disabled /></label>
			<div class="actions">
				<button type="submit" class="primary" disabled>Add user</button>
			</div>
		</form>
	</section>
</main>
