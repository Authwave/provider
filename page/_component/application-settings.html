<section class="settings-panel stack">
	<h2>Application settings</h2>

	<p role="status" hidden data-bind:hidden="?!success" data-bind:text="success"></p>
	<p role="alert" hidden data-bind:hidden="?!error" data-bind:text="error"></p>

	<form method="post" class="form-fields stack compact" data-bind:action="url">
		<label>
			<span>ID</span>
			<input name="id" readonly data-bind:value="@" />
		</label>
		<label>
			<span>Name</span>
			<input name="name" required maxlength="128" data-bind:value="@" />
		</label>
		<label>
			<span>Production deployment</span>
			<select name="productionApplicationDeploymentId">
				<option data-list="production-options" data-bind:value="value" data-bind:text="label" data-bind:selected="?selected"></option>
			</select>
		</label>

		<div class="actions">
			<button type="submit" name="do" value="save-application">Save application settings</button>
		</div>
	</form>
</section>
