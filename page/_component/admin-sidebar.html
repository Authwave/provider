<a class="brand" href="/admin/" aria-label="{{applicationName}} administration">
	<picture>
		<source media="(prefers-color-scheme: dark)" srcset="/asset/default-logo.svg" data-bind:srcset="darkLogoPath" />
		<img src="/asset/default-logo.svg" alt="{{applicationName}}" data-bind:src="logoPath" />
	</picture>
</a>
<details class="sidebar-menu">
	<summary data-icon="menu-2"><span>Menu</span></summary>
	<div class="sidebar-content">
		<nav class="side-navigation" aria-label="Administration">
			<ul>
				<li><button type="button" data-icon="home">Home</button></li>
				<li><a href="/admin/" data-icon="chart-bar" aria-current="page">Dashboard</a></li>
				<li><button type="button" data-icon="shield">Security</button></li>
				<li><button type="button" data-icon="mail">Emails <span class="notification" aria-label="8 notifications">8</span></button></li>
				<li><button type="button" data-icon="apps">Integrations</button></li>
				<li><button type="button" data-icon="chart-pie">Reporting</button></li>
				<li><button type="button" data-icon="users">Users</button></li>
			</ul>
		</nav>
		<div class="sidebar-bottom">
			<nav class="side-navigation" aria-label="Application controls">
				<ul>
					<li><button type="button" data-icon="lifebuoy">Support</button></li>
					<li><button type="button" data-icon="settings">Settings</button></li>
					<li><button type="button" data-icon="credit-card">Billing</button></li>
				</ul>
			</nav>
			<section class="setup-card" aria-labelledby="setup-title">
				<div class="toolbar"><h2 id="setup-title">Complete account</h2><span>Step 3 of 4</span></div>
				<progress value="3" max="4" aria-label="Account setup: 3 of 4 steps complete">75%</progress>
				<ul class="checklist">
					<li data-icon="circle-check">Complete your profile</li>
					<li data-icon="circle-check">Verify your email</li>
					<li data-icon="circle-check">Configure your application</li>
					<li data-icon="shield">Review security settings</li>
				</ul>
				<button type="button">Continue setup</button>
			</section>
			<application-switcher />
		</div>
	</div>
</details>
