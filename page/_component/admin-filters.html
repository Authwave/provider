<details class="disclosure-menu">
	<summary class="control" data-icon="filter" aria-label="Filters"><span class="control-label">Filters</span></summary>
	<form class="disclosure-content form-fields" action="/admin/" method="get">
		<input type="hidden" name="period" data-bind:value="period" />
		<input type="hidden" name="activity" data-bind:value="activity" />
		<input type="hidden" name="sort" data-bind:value="sort" />
		<input type="hidden" name="from" data-bind:value="from" />
		<input type="hidden" name="to" data-bind:value="to" />
		<label><span>Status</span><select name="status" data-state><option value="all">All statuses</option><option value="success">Success</option><option value="failed">Failed</option><option value="abandoned">Abandoned</option></select></label>
		<label><span>Authentication method</span><select name="method" data-state><option value="all">All methods</option><option value="password">Password</option><option value="email">Email security code</option></select></label>
		<label><span>Email or authentication ID</span><input type="search" name="search" data-bind:value="search" placeholder="Search activity" maxlength="100" /></label>
		<button type="submit" class="primary">Apply filters</button>
		<a href="/admin/">Reset filters</a>
	</form>
</details>
