<form method="get" class="toolbar panel-body activity-controls" aria-label="Activity filters">

	<label class="toggle-badge"><input type="checkbox" name="activitySuccess" value="yes" disabled /><span>Successful</span></label>
	<label class="toggle-badge"><input type="checkbox" name="activityFailed" value="yes" disabled /><span>Failed</span></label>
	<label class="toggle-badge"><input type="checkbox" name="activityAbandoned" value="yes" disabled /><span>Abandoned</span></label>
	<button type="submit" disabled>Apply filters</button>
</form>
