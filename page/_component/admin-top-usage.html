<section id="admin-top-usage" class="settings-panel stack" aria-labelledby="top-usage-title">
	<h2 id="top-usage-title">Top usage</h2>
	<form method="get" class="segmented-control" aria-label="Top usage grouping">
		<button name="topUsage" value="users" aria-pressed="true" disabled><span>Users</span></button>
		<button name="topUsage" value="countries" aria-pressed="false" disabled><span>Countries</span></button>
		<button name="topUsage" value="devices" aria-pressed="false" disabled><span>Devices</span></button>
	</form>
	<table class="summary-table">
		<thead><tr><th scope="col">—</th><th scope="col">Logins</th></tr></thead>
		<tbody></tbody>
	</table>
	<p class="muted">Usage reporting is not connected yet.</p>
	<footer><a class="card-link" aria-disabled="true"><span>See all users</span><span data-icon="arrow-right" aria-hidden="true"></span></a></footer>
</section>
