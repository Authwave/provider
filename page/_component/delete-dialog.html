<dialog id="delete-dialog" class="delete-dialog" aria-labelledby="delete-dialog-title">
	<form method="dialog" class="stack">
		<h2 id="delete-dialog-title"></h2>
		<div class="actions">
			<button type="submit" value="cancel" autofocus>Cancel</button>
			<button type="submit" value="confirm" class="primary">Confirm delete</button>
		</div>
	</form>
</dialog>
