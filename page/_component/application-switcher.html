<label>
	<span>Application</span>
	<span class="select-control" data-icon="selector">
		<select name="scope">
			<option value="" disabled data-bind:hidden="?hasApplications" data-bind:selected="?!hasApplications">No applications</option>
			<option data-list="scope-applications" data-bind:value="scopeValue" data-bind:text="scopeTitle" data-bind:selected="?scopeSelected"></option>
		</select>
	</span>
</label>
