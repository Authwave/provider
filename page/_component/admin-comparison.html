<details class="disclosure-menu">
	<summary class="control">Comparison</summary>
	<form class="disclosure-content form-fields" method="get">
		<label>
			<span>Comparison period</span>
			<select name="reportComparison" disabled>
				<option value="previous">Last period</option>
				<option value="previous-1">Last period - 1</option>
				<option value="month">Same point last month</option>
				<option value="quarter">Previous quarter</option>
				<option value="year">Previous year</option>
			</select>
		</label>
		<div class="actions">
			<button type="submit" disabled><span>Apply comparison</span></button>
		</div>
	</form>
</details>
