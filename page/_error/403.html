<main id="main-content">
	<header class="auth-heading">
		<picture>
			<source media="(prefers-color-scheme: dark)" srcset="/asset/default-logo.svg" data-bind:srcset="darkLogoPath" />
			<img class="logo" src="/asset/default-logo.svg" alt="{{applicationName}} logo" data-bind:src="logoPath" />
		</picture>

		<h1 id="auth-title" data-bind:text="accessTitle">You're signed in</h1>
		<p data-bind:text="accessMessage">This account doesn't have access to user administration.</p>
		<p><a href="{{returnUri}}">Continue to <span data-bind:text="applicationName">Amazing App</span></a></p>
	</header>

	<form method="post" action="/login/access-denied/" data-flux>
		<div class="actions">
			<button type="submit" name="do" value="switch-account"><span>Sign in with another account</span></button>
		</div>
	</form>

	<footer>
		<p><a href="/help/">Need help?</a></p>
	</footer>
</main>
