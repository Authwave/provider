<main id="main-content">
	<header class="auth-heading">
		<picture>
			<source media="(prefers-color-scheme: dark)" srcset="/asset/default-logo.svg" data-bind:srcset="darkLogoPath" />
			<img class="logo" src="/asset/default-logo.svg" alt="{{applicationName}} logo" data-bind:src="logoPath" />
		</picture>

		<p>Logging in as <a href="/login/?email={{email}}" data-bind:text="email">example@example.com</a>.</p>
	</header>

	<form method="post">
		<p>We've just emailed a security code to your email address.</p>
		<p>Enter the five-digit code below to confirm it's you.</p>

		<p class="form-error" role="alert" data-template="error" data-bind:text></p>
		<security-code></security-code>

		<button name="do" value="confirm" class="primary" type="submit">
			<span>Confirm</span>
		</button>
	</form>

	<p>Didn't receive the code? <a href="/login/authenticate/">Return to sign-in to request another</a>.</p>

	<footer>
		<p>
			<a href="/login/?do=cancel">Cancel</a> and return to <span data-bind:text="applicationName">Amazing App.</span>
		</p>
		<p>
			<a href="/help/">Need help?</a>
		</p>
	</footer>

</main>
