<main id="main-content">
	<header class="auth-heading">
		<img class="logo" src="/asset/default-logo.svg" alt="{{applicationName}} logo" data-bind:src="logoPath" />

		<p>Logging in as <a href="/login/?email={{email}}" data-bind:text="email">example@example.com</a>.</p>
	</header>

	<form method="post" data-flux>
		<p>Enter your password to continue. If you don't have one yet, or you've forgotten it, enter the password you'd like to use.</p>
		<div class="field-action">
			<label>
				<span>Password</span>
				<input type="password" name="password" autocomplete="current-password" placeholder="e.g. •••••••••••••••" minlength="12" required data-autofocus />
			</label>

			<button name="do" value="password" class="primary" type="submit" data-icon="login">
				<span>Log in with password</span>
			</button>
		</div>

		<p>Alternatively, receive a security code by email to log in without a password.</p>

		<div class="actions">
			<button name="do" value="link" type="submit" data-icon="mail" formnovalidate>
				<span>Email security code</span>
			</button>
		</div>
	</form>

	<footer>
		<p>
			<a href="/login/?do=cancel">Cancel</a> and return to <span data-bind:text="applicationName">Amazing App.</span>
		</p>
		<p>
			<a href="/help/">Need help?</a>
		</p>
	</footer>

</main>
