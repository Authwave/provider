<login-header />

<form method="post">
	<h1>Log in</h1>
	<label>
		<span>Your e-mail address</span>
		<input data-bind:value="email" type="email" name="email" autofocus autocomplete="off" />
	</label>

<!--	<div class="help">-->
<!--		<a href="/help#forgot-email" target="_blank">Forgot email?</a>-->
<!--	</div>-->

	<p>Please type your email address to log in or sign up to <span data-bind:text="title">the application</span>.</p>

	<div class="actions">
		<button name="do" value="continue" class="primary">Continue</button>
	</div>

	<div class="cancel">
		<a href="/" data-bind:href="clientHost">Cancel</a>
	</div>
</form>
