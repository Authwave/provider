<main data-flux="update" id="main-content">
	<header class="auth-heading">
		<picture>
			<source media="(prefers-color-scheme: dark)" srcset="/asset/default-logo.svg" data-bind:srcset="darkLogoPath" />
			<img class="logo" src="/asset/default-logo.svg" alt="{{applicationName}} logo" data-bind:src="logoPath" />
		</picture>

		<h1 id="auth-title">Log in to <span data-bind:text="applicationName">Amazing App</span></h1>
		<p>Enter your email address to log in or create an account.</p>
	</header>

	<form method="post" data-flux>
		<label>
			<span>Email address</span>
			<input type="email" name="email" data-bind:value="email" autocomplete="email" placeholder="e.g. you@example.com" required data-autofocus />
		</label>

		<div class="actions">
			<button type="submit" name="do" value="continue" class="primary"><span>Continue</span></button>
		</div>
	</form>

	<footer>
		<p>
			<a href="/login/?do=cancel">Cancel</a> and return to <span data-bind:text="applicationName">Amazing App.</span>
		</p>
		<p>
			<a href="/help/">Need help?</a>
		</p>
	</footer>

</main>
