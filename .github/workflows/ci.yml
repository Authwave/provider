name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  composer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v6

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Composer install
        uses: php-actions/composer@v6
        with:
          version: "2"
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pcntl pdo_sqlite sodium
          args: --prefer-dist

      - name: Check out Flair styles
        uses: actions/checkout@v6
        with:
          repository: BrightFlair/flair
          path: .ci/flair

      - name: Install Node dependencies
        run: |
          mkdir -p ../../BrightFlair
          ln -s "$GITHUB_WORKSPACE/.ci/flair" ../../BrightFlair/flair
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          npm ci

      - name: Build browser assets
        run: |
          mkdir -p www
          node_modules/.bin/esbuild script/script.es6 --bundle --sourcemap --outfile=www/script.js --loader:.es6=js --target=chrome105,firefox105,edge105,safari15
          node_modules/.bin/sass style/style.scss www/style.css --source-map --embed-sources --embed-source-map
          cp -R asset www/asset

      - name: Archive build
        run: mkdir -p /tmp/github-actions && tar --exclude=".git" --exclude="node_modules" --exclude=".ci" -cf /tmp/github-actions/build.tar ./

      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions/build.tar
          retention-days: 1

  phpunit:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: PHP Unit tests
        uses: php-actions/phpunit@v4
        with:
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pcntl pdo_sqlite sodium
          configuration: phpunit.xml

  behat:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: Configure HTTP browser tests
        run: |
          printf '[session]\ncookie_secure=false\n' > config.dev.ini

      - name: Start Chrome
        run: |
          docker run -d --name behat-chrome --network host \
            --entrypoint google-chrome-stable \
            registry.gitlab.com/behat-chrome/docker-chrome-headless:latest \
            --headless --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --blink-settings=scriptEnabled=false \
            --host-resolver-rules="MAP *.test 127.0.0.1" --no-proxy-server \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222

      - name: Run Behat
        uses: php-actions/behat@chrome
        env:
          BEHAT_CHROME_API_URL: http://127.0.0.1:9222
        with:
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pcntl pdo_sqlite sodium
          # Keep the fixture database, app and callback server in the test container.
          vendored_behat_path: test/behat/run-behat

      - name: Stop Chrome
        if: always()
        run: docker rm -f behat-chrome

  phpstan:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: PHP Static Analysis
        uses: php-actions/phpstan@v3
        with:
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pcntl pdo_sqlite sodium
          path: class/
          level: 6

  phpmd:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: PHP Mess Detector
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pcntl pdo_sqlite sodium
          command: exec
          args: -- phpmd class/ text phpmd.xml

  phpcs:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: PHP Code Sniffer
        uses: php-actions/phpcs@v1
        with:
          php_version: ${{ matrix.php }}
          vendored_phpcs_path: vendor/bin/phpcs
          path: class/
          standard: phpcs.xml
