name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  composer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v6

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Composer install
        uses: php-actions/composer@v6
        with:
          version: "2"
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pdo_sqlite sodium
          args: --prefer-dist

      - name: Archive build
        run: mkdir -p /tmp/github-actions && tar --exclude=".git" -cf /tmp/github-actions/build.tar ./

      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions/build.tar
          retention-days: 1

  phpunit:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: PHP Unit tests
        uses: php-actions/phpunit@v4
        with:
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pdo_sqlite sodium
          configuration: phpunit.xml

  behat:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: Start Chrome
        run: |
          docker run -d --name behat-chrome --network host \
            registry.gitlab.com/behat-chrome/docker-chrome-headless:latest \
            google-chrome-stable --headless --no-sandbox --disable-dev-shm-usage \
            --disable-gpu --blink-settings=scriptEnabled=false \
            --host-resolver-rules="MAP *.test 127.0.0.1" --no-proxy-server \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222

      - name: Run Behat
        uses: php-actions/behat@chrome
        env:
          BEHAT_CHROME_API_URL: http://127.0.0.1:9222
        with:
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pdo_sqlite sodium
          # Keep the fixture database, app and callback server in the test container.
          vendored_behat_path: test/behat/run-behat

      - name: Stop Chrome
        if: always()
        run: docker rm -f behat-chrome

  phpstan:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: PHP Static Analysis
        uses: php-actions/phpstan@v3
        with:
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pdo_sqlite sodium
          path: class/
          level: 6

  phpmd:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: PHP Mess Detector
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php }}
          php_extensions: curl dom mbstring pdo_sqlite sodium
          command: exec
          args: -- phpmd class/ text phpmd.xml

  phpcs:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xf /tmp/github-actions/build.tar ./

      - name: PHP Code Sniffer
        uses: php-actions/phpcs@v1
        with:
          php_version: ${{ matrix.php }}
          vendored_phpcs_path: vendor/bin/phpcs
          path: class/
          standard: phpcs.xml
