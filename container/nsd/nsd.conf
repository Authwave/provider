server:
    ip-address: 0.0.0.0
    do-ip6: no
    username: nsd
    chroot: ""
    server-count: 1
    pidfile: /run/nsd/nsd.pid
    zonelistfile: /var/lib/nsd/zone.list
    xfrdfile: /var/lib/nsd/xfrd.state
    hide-version: yes
    hide-identity: yes
    refuse-any: yes
    logfile: /dev/stderr
    log-only-syslog: no

# Administration is only available through docker compose exec, not a TCP port.
remote-control:
    control-enable: yes
    control-interface: /run/nsd/control.sock

pattern:
    name: authwave
    zonefile: /etc/nsd/shared.zone
